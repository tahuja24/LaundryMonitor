<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIET Vendor Laundry Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [hostel, setHostel] = React.useState('Hostel J');
      
      const laundrySchedule = {
        'Hostel J': { dropDays: ['Tuesday', 'Friday'], returnDays: ['Thursday', 'Sunday'] },
        'Hostel M (Anantam)': { dropDays: ['Monday', 'Thursday'], returnDays: ['Wednesday', 'Saturday'] },
        'Hostel L (Viyat)': { dropDays: ['Tuesday', 'Friday'], returnDays: ['Thursday', 'Sunday'] },
        'Hostel N (Girls)': { dropDays: ['Wednesday', 'Saturday'], returnDays: ['Friday', 'Monday'] }
      };

      const [logs, setLogs] = React.useState([
        {
          id: 'L-102',
          dropDate: '2026-10-27 (Tuesday)',
          dueDate: '2026-10-29 (Thursday)',
          status: 'At Laundry Vendor',
          totalItems: 8,
          breakdown: '3 T-shirts, 2 Jeans, 2 Shorts, 1 Towel',
          notes: 'Tag #42 marked'
        },
        {
          id: 'L-101',
          dropDate: '2026-10-24 (Friday)',
          dueDate: '2026-10-26 (Sunday)',
          status: 'Collected',
          totalItems: 6,
          breakdown: '2 Formal Shirts, 3 T-shirts, 1 Trouser',
          notes: 'Tag #42 marked'
        }
      ]);

      const [showModal, setShowModal] = React.useState(false);
      const [newTotal, setNewTotal] = React.useState('');
      const [newBreakdown, setNewBreakdown] = React.useState('');
      const [newNotes, setNewNotes] = React.useState('');

      React.useEffect(() => {
        lucide.createIcons();
      }, [logs, showModal]);

      const handleAddLaundry = (e) => {
        e.preventDefault();
        if (!newTotal || !newBreakdown) return;

        const schedule = laundrySchedule[hostel];
        const newEntry = {
          id: `L-10${logs.length + 1}`,
          dropDate: `Today (${schedule.dropDays[0]})`,
          dueDate: `In 2 Days (${schedule.returnDays[0]})`,
          status: 'At Laundry Vendor',
          totalItems: parseInt(newTotal),
          breakdown: newBreakdown,
          notes: newNotes || 'Standard wash'
        };

        setLogs([newEntry, ...logs]);
        setNewTotal('');
        setNewBreakdown('');
        setNewNotes('');
        setShowModal(false);
      };

      const currentSchedule = laundrySchedule[hostel];

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
              <div className="flex items-center gap-2 text-indigo-400 font-semibold mb-1">
                <i data-lucide="shield-check" className="w-5 h-5"></i>
                <span>TIET Smart Campus Initiative</span>
              </div>
              <h1 className="text-3xl font-bold tracking-tight text-white">Vendor Laundry Tracker</h1>
            </div>
            <div className="mt-4 md:mt-0 flex items-center gap-3">
              <select 
                value={hostel} 
                onChange={(e) => setHostel(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="Hostel J">Hostel J</option>
                <option value="Hostel M (Anantam)">Hostel M (Anantam)</option>
                <option value="Hostel L (Viyat)">Hostel L (Viyat)</option>
                <option value="Hostel N (Girls)">Hostel N (Girls)</option>
              </select>
              <button
                onClick={() => setShowModal(true)}
                className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-colors shadow-lg shadow-indigo-600/20"
              >
                <i data-lucide="plus" className="w-4 h-4"></i> Log New Drop
              </button>
            </div>
          </header>

          <div className="bg-gradient-to-r from-indigo-900/40 via-slate-800/40 to-slate-800/40 border border-indigo-500/30 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
              <span className="text-xs uppercase tracking-wider text-indigo-400 font-bold">Schedule Info for {hostel}</span>
              <h2 className="text-xl font-bold text-white mt-1">Weekly Vendor Drop & Return Days</h2>
              <p className="text-slate-400 text-sm mt-1">Make sure to submit your clothes on designated mornings before collection time.</p>
            </div>
            <div className="flex gap-4 w-full md:w-auto">
              <div className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-4 text-center flex-1 md:w-40">
                <p className="text-xs text-slate-400 font-medium">Drop Days</p>
                <p className="text-lg font-bold text-indigo-300 mt-1">{currentSchedule.dropDays.join(', ')}</p>
              </div>
              <div className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-4 text-center flex-1 md:w-40">
                <p className="text-xs text-slate-400 font-medium">Return Days</p>
                <p className="text-lg font-bold text-emerald-300 mt-1">{currentSchedule.returnDays.join(', ')}</p>
              </div>
            </div>
          </div>

          <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="clipboard-list" className="w-5 h-5 text-indigo-400"></i>
            <span>Laundry History & Current Status</span>
          </h3>

          <div className="grid grid-cols-1 gap-4">
            {logs.map((log) => {
              const isActive = log.status === 'At Laundry Vendor';
              return (
                <div 
                  key={log.id} 
                  className={`border rounded-xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all ${
                    isActive ? 'bg-slate-800/50 border-amber-500/30 shadow-lg shadow-amber-500/5' : 'bg-slate-800/20 border-slate-700/40'
                  }`}
                >
                  <div className="space-y-1">
                    <div className="flex items-center gap-3">
                      <span className="font-bold text-white text-lg">{log.id}</span>
                      <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                        isActive ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                      }`}>
                        {log.status}
                      </span>
                    </div>
                    <p className="text-sm font-medium text-slate-300">
                      <strong className="text-indigo-300">{log.totalItems} Items Given:</strong> {log.breakdown}
                    </p>
                    <p className="text-xs text-slate-400">Notes: {log.notes}</p>
                  </div>

                  <div className="flex flex-col md:items-end gap-1 bg-slate-900/50 p-3 rounded-lg border border-slate-800 w-full md:w-auto">
                    <div className="flex items-center gap-2 text-xs text-slate-400">
                      <i data-lucide="calendar" className="w-3.5 h-3.5 text-indigo-400"></i>
                      <span>Dropped: {log.dropDate}</span>
                    </div>
                    <div className="flex items-center gap-2 text-xs font-semibold">
                      <i data-lucide="clock" className="w-3.5 h-3.5 text-amber-400"></i>
                      <span className={isActive ? 'text-amber-400' : 'text-slate-400'}>Due: {log.dueDate}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">Log Given Laundry</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleAddLaundry} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Total Number of Clothes</label>
                    <input 
                      type="number" 
                      required
                      placeholder="e.g. 7"
                      value={newTotal}
                      onChange={(e) => setNewTotal(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Clothing Item Breakdown</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. 3 T-shirts, 2 Jeans, 2 Towels"
                      value={newBreakdown}
                      onChange={(e) => setNewBreakdown(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 imgs mb-1">Laundry Tag / Notes (Optional)</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Tag #42, Bag 1"
                      value={newNotes}
                      onChange={(e) => setNewNotes(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    />
                  </div>
                  <div className="flex justify-end gap-3 mt-6">
                    <button 
                      type="button" 
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-indigo-600/20"
                    >
                      Save Log
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
